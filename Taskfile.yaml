# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

silent: true

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  clean:
    desc: Clean build
    cmd: rm -rf build

  configure:
    desc: Configure cmake build directory
    cmd: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
    status:
      - test -f build/CMakeCache.txt

  build:
    desc: Run the build system
    cmd: cmake --build build

  test:
    desc: Run unit tests
    deps:
      - build
    cmd: ctest --build-dir build --output-on-failure

  format:
    desc: Format sources with clang-format
    cmd: clang-format -i src/*.c include/cshell/*.h

  lint:
    desc: Lint sources with clang-tidy
    deps:
      - configure
    # Homebrew's clang-tidy does not locate the macOS SDK headers on its own.
    cmd: SDKROOT="${SDKROOT:-$(xcrun --show-sdk-path 2>/dev/null)}" clang-tidy -p build src/*.c

  cshell:
    desc: Run the cshell program
    deps:
      - build
    cmd: build/cshell
    interactive: true
